name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install audio dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes libasound2-dev pkg-config

    - name: Clippy
      run: cargo clippy -- -D warnings --verbose

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Run ROM tests
      run: ./test_suites/run.sh
